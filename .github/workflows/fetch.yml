name: Fetch and publish

on:
  schedule:
    - cron: "47 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # For the last step, which reads the after-fetch check's runs.
  actions: read

concurrency:
  group: fetch-and-publish
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m shonannews

      - name: Commit and push if there are changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add _posts data/state.json archive
            git commit -m "Add new Shonan News summaries"
            git push
          else
            echo "No new items; nothing to commit."
          fi

      # After the commit, so posts are already out. Fails, and so emails, if the previous fetch run
      # was never checked. See the backend spec, "After-fetch check".
      - name: Check that the previous fetch was checked
        if: always()
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.after_fetch proof --this-run ${{ github.run_id }}
