name: Fetch and publish

on:
  schedule:
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-and-publish
  cancel-in-progress: false

env:
  TZ: Asia/Tokyo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: DEBUG shonanjin.com fetch with browser UA
        run: |
          curl -sD headers.txt -o body.xml -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" "https://shonanjin.com/feed/"
          echo "=== response headers ==="
          cat headers.txt
          echo "=== body: line count and byte count ==="
          wc -lc body.xml
          echo "=== body: lines 135-150 ==="
          sed -n '135,150p' body.xml
          echo "=== well-formedness check ==="
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('body.xml')" && echo "WELL-FORMED" || echo "PARSE ERROR (see above)"

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m shonannews

      - name: Commit and push if there are changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add _posts data/state.json
            git commit -m "Add new Shonan News summaries"
            git push
          else
            echo "No new items; nothing to commit."
          fi
