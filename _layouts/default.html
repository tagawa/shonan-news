<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    {% if page.url == "/" %}
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
    {% else %}
      <p class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></p>
    {% endif %}
  </header>
  <main id="main" class="site-main">
    {{ content }}
  </main>
  <footer class="site-footer">
    <p class="site-footer-links"><a href="{{ '/about/' | relative_url }}">About</a> &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    <p class="disclosure">English summaries are machine-generated from Japanese sources and may contain errors. Always read the original.</p>
  </footer>
</body>
</html>
